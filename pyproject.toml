[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-hand-viewer"
version = "0.5.0"
description = "筋電（EMG）信号から手のポーズを推定・可視化するPythonライブラリ"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.20.0",
    "PyQt5>=5.15.0",
    "pyqtgraph>=0.12.0",
    "PyOpenGL>=3.1.0",
]

[project.optional-dependencies]
# 学習済みモデルを使うとき
inference = ["torch>=1.9.0"]
# Myo Armbandを実機で使うとき
myo = ["pyomyo"]
# 開発（試験・書式）
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/kakuteki/emg-hand-viewer"

[tool.setuptools.packages.find]
include = ["emg_realtime_viz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
