# Ruff configuration for EMG Hand Pose Estimation

# Target Python version
target-version = "py39"

# Line length
line-length = 100

# Exclude directories
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

[lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top - needed for conditional imports
    "E722",   # bare except - sometimes needed for cleanup code
    "B007",   # loop variable not used - sometimes intentional
    "B008",   # function call in default argument
    "B905",   # zip without strict
    "UP006",  # Use `type` instead of `Type` - keep for Python 3.9 compatibility
    "UP035",  # Import from typing - keep for Python 3.9 compatibility
    "UP028",  # yield from - optional style preference
    "UP045",  # X | None syntax - not supported in Python 3.9
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"*_source.py" = ["F401"]  # Allow unused imports in device sources (optional deps)
"hand_model.py" = ["F401"]  # Allow unused imports for optional PyQt features

[lint.isort]
known-first-party = ["emg_realtime_viz"]

[format]
# Use double quotes
quote-style = "double"

# Indent with spaces
indent-style = "space"
